<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <script src="https://kit.fontawesome.com/76dd712398.js" crossorigin="anonymous"></script>
        <title>BookHub Header</title>
        <style>
            body {
                margin: 0;
            }

            header {
                /* Visual */
                background-color: #a0ac90;
                padding-top: 15px;
                padding-bottom: 15px;
                height: 30px;
                /* Functional */
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                position: sticky;
            }

            .HeaderTitle {
                color: #ede6df;
                font-size: 24px;
                text-decoration: underline;
                text-align: center;
            }

            .HeaderTitle:hover {
                color: #d1c0ae;
                font-size: 26px;
                cursor: pointer;
            }

            .options {
                text-align: center;
                color: #ede6df;
                padding-right: 10px;
                font-size: 25px;
            }

            .fa-circle-user:hover {
                color: #d1c0ae;
                font-size: 27px;
                cursor: pointer;
            }
            
            .fa-list:hover {
                color: #d1c0ae;
                font-size: 27px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <header>
            <!-- Hrefs to be filled with file locations for associated pages -->
            <!-- Empty div to keep content centered -->
            <div></div>
            <div class="HeaderTitle" href="">BookHub</div>
            <!-- Temporary user profile and options icons -->
            <div class="options"><i class="fa-regular fa-circle-user" href=""></i><i class="fa-solid fa-list" href=""></i></div>
        </header>
    </body>
</html>
